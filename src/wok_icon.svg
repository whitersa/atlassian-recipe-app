<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 100% Full-bleed rich culinary orange background -->
  <rect width="512" height="512" fill="#E65F3C" />

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Steam Lines: 3 graceful, organically spaced aroma waves -->
    <!-- Steam 1 (Left, delicate) -->
    <path d="M 195 210 C 180 180, 205 160, 195 130" stroke-width="16" opacity="0.9" />
    <!-- Steam 2 (Center, tallest & prominent) -->
    <path d="M 245 210 C 230 165, 270 145, 255 95" stroke-width="18" />
    <!-- Steam 3 (Right, gentle) -->
    <path d="M 295 210 C 285 185, 310 165, 300 135" stroke-width="16" opacity="0.9" />

    <!-- Wok Rim: Elegant curved upper rim with subtle perspective -->
    <!-- Basin Silhouette: Smooth deep parabolic bowl -->
    <path d="M 124 250 
             C 134 380, 336 380, 346 250 
             C 290 262, 180 262, 124 250 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="12" />

    <!-- Left Helper Handle (Smooth integrated curved ear) -->
    <path d="M 124 254 C 88 254, 88 286, 124 286" stroke-width="18" />

    <!-- Right Ergonomic Handle (Streamlined with hanging hole) -->
    <!-- Handle shaft -->
    <path d="M 346 254 L 434 200" stroke-width="24" />
    <!-- Handle rounded end cap accent -->
    <circle cx="434" cy="200" r="12" fill="#FFFFFF" stroke="none" />
    <!-- Subtle hanging hole cut into handle tip -->
    <circle cx="434" cy="200" r="4.5" fill="#E65F3C" stroke="none" />
  </g>
</svg>
